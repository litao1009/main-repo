<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>铸文坊账号管家</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 13px;
      background: #fff;
      color: #1d2129;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .header-title { font-size: 14px; font-weight: 600; color: #1d2129; }
    .header-version { font-size: 11px; color: #c9cdd4; margin-left: auto; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .status-idle { background: #f7f8fa; color: #86909c; }
    .status-active { background: #fff7ed; color: #ea580c; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-idle { background: #c9cdd4; }
    .dot-active { background: #f97316; animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    hr { border: none; border-top: 1px solid #f0f0f0; margin: 12px 0; }

    .steps {
      font-size: 11px;
      color: #86909c;
      line-height: 1.8;
    }
    .steps span { color: #4e5969; font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <img class="header-icon" src="icons/icon48.png" alt="铸文坊">
    <span class="header-title">铸文坊账号管家</span>
    <span class="header-version">v1.3</span>
  </div>

  <div id="statusBar" class="status-bar status-idle">
    <span id="statusDot" class="status-dot dot-idle"></span>
    <span id="statusText">就绪</span>
  </div>

  <hr>

  <div class="steps">
    使用步骤：<br>
    1. 在浏览器打开铸文坊「发布账号配置」页面<br>
    2. 进入绑定账号，选择<span>番茄小说</span>、<span>七猫</span>或<span>逐浪网</span>，点击前往登录<br>
    3. 在弹出窗口完成平台登录（新番茄号需完成作家入驻）<br>
    4. 凭证与作者资料将<span>自动回填</span>至绑定表单
  </div>

  <script src="popup.js"></script>
</body>
</html>
